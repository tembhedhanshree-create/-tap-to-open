<!DOCTYPE html>
<html>
<head>
<title>SMS - Dhanshree Tembhe</title>
<style>
body{font-family:Arial;text-align:center;background:#e8eef7;padding:20px}
.box{background:#fff;padding:25px;border-radius:20px;max-width:360px;margin:auto}
button{width:100%;padding:12px;margin:6px 0;border:0;border-radius:8px;color:#fff;font-weight:bold}
.b1{background:#22a559}.b2{background:#2e68d1}.b3{background:#e23a3a}.b4{background:#999}
input{width:92%;padding:10px;margin:6px 0;border:1px solid #ccc;border-radius:8px}
#out{margin-top:12px;background:#e6f9e6;padding:12px;border-radius:8px}
</style>
</head>
<body>
<div class="box">
<h3>WELCOME TO SMS</h3>
<p>Student Management System</p>
<input id="name" placeholder="Enter student name">
<input id="roll" placeholder="Enter roll number">
<button class="b1" onclick="add()">+ ADD NEW STUDENT</button>
<button class="b2" onclick="view()">VIEW STUDENT</button>
<button class="b3" onclick="del()">DELETE STUDENT</button>
<button class="b4" onclick="exitApp()">EXIT</button>
<div id="out">Student Added</div>
</div>
<script>
  let students=[];
function add(){
let n=name.value, r=roll.value;
if(n&&r){
students.push(n+" - "+r);
out.innerHTML="Student Added: "+n+"<br>Roll: "+r;
name.value=""; roll.value="";
}else out.innerHTML="Enter Name & Roll!";
}
function view(){
if(students.length==0) out.innerHTML="No Students Yet";
else out.innerHTML="<b>Student Details:</b><br>"+students.join("<br>");
  }
  function del(){students=[];out.innerHTML="All Students Deleted";}
function exitApp(){out.innerHTML="Thank you...!";}
</script>
</body>
</html>
