<!DOCTYPE html>
<html>
<head>
<title>SMS</title>
<style>
body{font-family:Arial;text-align:center;background:#f0f0f0;margin-top:50px}
.box{background:white;width:300px;margin:auto;padding:20px;border-radius:10px;box-shadow:0 0 10px gray}
input{width:90%;padding:8px;margin:5px;border:1px solid gray;border-radius:5px}
button{padding:8px 15px;margin:5px;background:#4CAF50;color:white;border:none;border-radius:5px;cursor:pointer}
button:hover{background:#45a049}
#list{margin-top:15px;text-align:left}
</style>
</head>
<body>
<div class="box">
<h2>WELCOME TO SMS</h2>
<p>Student Management System</p>
<input id="name" placeholder="Enter Name">
<input id="roll" placeholder="Enter Roll No">
<br>
<button onclick="addStudent()">ADD STUDENT</button>
<button onclick="viewStudent()">VIEW STUDENT</button>
<button onclick="deleteStudent()">DELETE</button>
<button onclick="location.reload()">EXIT</button>
<div id="list"></div>
</div>

<script>
let students = JSON.parse(localStorage.getItem("students") || "[]");

function addStudent(){
 let n = document.getElementById("name").value;
 let r = document.getElementById("roll").value;
 if(n=="" || r==""){ alert("Name aani Roll No tak!"); return; }
 students.push({name:n, roll:r});
 localStorage.setItem("students", JSON.stringify(students));
 alert(n + " add jhala!");
 document.getElementById("name").value="";
 document.getElementById("roll").value="";
 viewStudent();
}

function viewStudent(){
 let l = document.getElementById("list");
 if(students.length==0){ l.innerHTML="<p>Khali kahi nahi!</p>"; return; }
 let html="<h4>Student List:</h4>";
 students.forEach((s,i)=>{
   html+= `<p>${i+1}. ${s.name} - ${s.roll}</p>`;
 });
 l.innerHTML=html;
}

function deleteStudent(){
 let r = document.getElementById("roll").value;
 if(r==""){ alert("Delete karaycha Roll No tak!"); return; }
 students = students.filter(s=>s.roll!=r);
 localStorage.setItem("students", JSON.stringify(students));
 alert("Delete jhala!");
 viewStudent();
}
</script>
</body>
</html>
