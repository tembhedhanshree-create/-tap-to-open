<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tap To Open</title>
<style>
body{margin:0;height:100vh;display:flex;justify-content:center;align-items:center;background:linear-gradient(135deg,#ffafbd,#ffc3a0);font-family:sans-serif}
.card{width:90%;max-width:350px;background:white;border-radius:25px;padding:30px;text-align:center;box-shadow:0 20px 40px rgba(0,0,0,0.2);cursor:pointer}
.envelope{font-size:80px;animation:bounce 1.5s infinite}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-15px)}}
.tap-text{margin-top:20px;font-size:22px;font-weight:bold;color:#ff6b81}
#message{display:none}
</style>
</head>
<body>
<div class="card" onclick="openCard()">
<div id="front">
<div class="envelope">💌</div>
<div class="tap-text">Tap to Open ❤️</div>
</div>
<div id="message">
<h1>Surprise! 🎉</h1>
<p>He specially tujhyasathi banavlay!</p>
<p style="font-size:40px">💖✨🌸</p>
</div>
</div>
<script>
function openCard(){
document.getElementById('front').style.display='none';
document.getElementById('message').style.display='block';
}
</script>
</body>
</html>
